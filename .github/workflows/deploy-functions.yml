name: Deploy Firebase Functions
# Plan Blaze activado: reintento de deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy to Firebase
        run: |
          set +e
          firebase deploy --only functions --project barretwater --force --non-interactive 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Resumen del error como anotaciones (visibles sin abrir el log completo)
            sed 's/\x1b\[[0-9;]*m//g' /tmp/deploy.log | grep -v '^\s*$' | tail -n 9 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $code
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/sa.json
